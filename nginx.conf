user www-data;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 100m;
    proxy_read_timeout 3600s;
    log_format gatehouse escape=json '{"time":"$time_iso8601","remote":"$remote_addr","scheme":"$scheme","method":"$request_method","host":"$host","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /data/access.log gatehouse;
    error_log /var/log/nginx/error.log warn;
    include /etc/nginx/conf.d/*.conf;
}
