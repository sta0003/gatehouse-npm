services:
  gatehouse:
    build: .
    container_name: gatehouse
    restart: unless-stopped
    # Host networking lets NGINX bind arbitrary TCP/UDP game ports without
    # rebuilding this file for every service. Linux hosts only.
    network_mode: host
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      GATEHOUSE_LAN_IP: ${GATEHOUSE_LAN_IP:?Set GATEHOUSE_LAN_IP in .env}
      TZ: Australia/Melbourne
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
